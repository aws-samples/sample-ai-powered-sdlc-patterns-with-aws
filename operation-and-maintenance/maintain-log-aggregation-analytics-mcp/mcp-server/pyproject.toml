[project]
name = "log-analysis-mcp"
version = "0.1.0"
description = "MCP server for AI-powered log aggregation and analysis"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0,<2.0.0", "boto3>=1.34.0,<2.0.0"]

[project.scripts]
log-analysis-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
